version: 2
project_name: ottercode
before:
  hooks:
    - go mod tidy
    - mkdir -p completions manpages
    - sh -c 'go run . completion bash > completions/ottercode.bash'
    - sh -c 'go run . completion zsh > completions/ottercode.zsh'
    - sh -c 'go run . completion fish > completions/ottercode.fish'
    - sh -c 'go run . man | gzip -c > manpages/ottercode.1.gz'
builds:
  - binary: ottercode
    env: [CGO_ENABLED=0, GOEXPERIMENT=greenteagc]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/ZoeySigel/ottercode/internal/version.Version={{.Version}}
archives:
  - name_template: "ottercode_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      [README.md, LICENSE.md, assets/otter.svg, "completions/*", "manpages/*"]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  use: git
